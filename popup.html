<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  body { width: 360px; }
  .site { border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px 8px; margin-top: 10px; }
  .site h3 { margin: 6px 0 4px; font-size: 13px; color: var(--fg); }
  .site .pin { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 4px; }
  .sub { margin-left: 22px; }
</style>
</head>
<body>
  <header>
    <strong>AIO 구매 도우미</strong>
    <label class="switch big" title="전체 켜기/끄기"><input type="checkbox" id="enabled"><span></span></label>
  </header>
  <p id="master-note" class="note"></p>
  <label class="row small"><input type="checkbox" id="dryRun"> 연습 모드 (누르지 않고 빨간 테두리만)</label>

  <div id="sites"></div>

  <div class="site">
    <h3>디스코드 모니터링</h3>
    <label class="row"><input type="checkbox" id="monitorEnabled"> 알림을 익스텐션 안에서 감시 (링크는 열지 않음)</label>
    <p id="monitorState" class="note"></p>
    <div class="bar" style="display:flex; gap:8px; align-items:center; margin-top:4px">
      <button id="monitorReconnect" class="link">다시 연결</button>
      <span class="note" style="flex:1"></span>
    </div>
  </div>

  <section>
    <h3>잡힌 알림 <button id="clearMonEvents" class="link">지우기</button></h3>
    <ol id="monEvents"></ol>
  </section>

  <section>
    <h3>기록 <button id="clearLog" class="link">지우기</button></h3>
    <ol id="log"></ol>
  </section>

  <footer>
    <a id="update" href="#" hidden></a>
    <a href="options.html" target="_blank">설정 자세히</a>
  </footer>
  <script src="popup.js" type="module"></script>
</body>
</html>
